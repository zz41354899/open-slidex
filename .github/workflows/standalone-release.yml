name: Standalone release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish after successful builds
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve immutable release ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.lock.outputs.sha }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - id: select
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          PUSH_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          RELEASE_TAG="${PUSH_TAG:-$INPUT_TAG}"
          if [ -n "$RELEASE_TAG" ]; then
            case "$RELEASE_TAG" in v*) ;; *) echo "Release tag must start with v." >&2; exit 1 ;; esac
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists; immutable assets will not be replaced." >&2
              exit 1
            fi
            echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.select.outputs.ref }}
      - id: lock
        env:
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
        run: |
          RESOLVED_SHA=$(git rev-parse HEAD)
          if [ -n "$RELEASE_TAG" ]; then
            TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            test "$TAG_COMMIT" = "$RESOLVED_SHA"
          fi
          echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

  security:
    name: Release security gates
    needs: resolve
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve, security]
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            archive: open-slidex-darwin-arm64.tar.gz
          - os: macos-15-intel
            target: darwin-x64
            archive: open-slidex-darwin-x64.tar.gz
          - os: windows-latest
            target: windows-x64
            archive: open-slidex-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.ref }}
      - name: Verify exact release tag commit
        if: needs.resolve.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          TESTED_COMMIT=$(git rev-parse HEAD)
          test "$TAG_COMMIT" = "$TESTED_COMMIT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - if: runner.os != 'Windows'
        run: npm run test:standalone
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-standalone-windows.ps1
      - run: npm run build:standalone
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/standalone/${{ matrix.archive }}
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/standalone/${{ matrix.archive }}
          sbom-path: dist/standalone/${{ matrix.archive }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            dist/standalone/${{ matrix.archive }}
            dist/standalone/${{ matrix.archive }}.spdx.json
          if-no-files-found: error

  publish-npm:
    name: Publish npm package
    if: needs.resolve.outputs.tag != ''
    needs: [resolve, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Validate release tag
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.ref }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "$TAG_COMMIT" = "$EXPECTED_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)" = "true"
          node -e 'const version = require("./packages/open-slidex/package.json").version; if (process.env.RELEASE_TAG !== `v${version}`) throw new Error(`Release tag ${process.env.RELEASE_TAG} must equal v${version}`)'
      - name: Check npm registry
        id: registry
        run: |
          PACKAGE_VERSION=$(node -p 'require("./packages/open-slidex/package.json").version')
          if npm view "open-slidex@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish open-slidex
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./packages/open-slidex --access public --provenance

  publish:
    name: Publish GitHub release
    if: needs.resolve.outputs.tag != ''
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Add immutable bootstrap installers
        run: cp install.sh install.ps1 release-assets/
      - name: Attest bootstrap installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/install.sh
            release-assets/install.ps1
      - name: Create SHA-256 manifest
        working-directory: release-assets
        run: sha256sum open-slidex-* install.sh install.ps1 > SHA256SUMS.txt
      - name: Publish release assets
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.ref }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          verify_remote_tag() {
            git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            REMOTE_TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            if [ "$REMOTE_TAG_COMMIT" != "$EXPECTED_SHA" ]; then
              echo "Release tag ${RELEASE_TAG} moved from tested commit ${EXPECTED_SHA} to ${REMOTE_TAG_COMMIT}." >&2
              exit 1
            fi
          }
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable assets will not be replaced." >&2
            exit 1
          fi
          verify_remote_tag
          gh release create "${RELEASE_TAG}" release-assets/* --draft --verify-tag --target "${EXPECTED_SHA}" --generate-notes --title "OpenSlideX ${RELEASE_TAG}"
          verify_remote_tag
          gh release edit "${RELEASE_TAG}" --draft=false
          if [ "$(gh release view "${RELEASE_TAG}" --json isImmutable --jq .isImmutable)" != "true" ]; then
            echo "Release ${RELEASE_TAG} is not immutable. Enable GitHub immutable releases before publishing npm." >&2
            exit 1
          fi
          verify_remote_tag
